<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1d09" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .card { fill: #1e293b; fill-opacity: 0.78; stroke: #334155; stroke-width: 1.5; rx: 10px; filter: url(#shadow); }
    .card-rule { fill: url(#ruleGrad); stroke: #f59e0b; stroke-width: 1.5; rx: 10px; filter: url(#shadow); }
    .subcard { fill: #0f172a; fill-opacity: 0.65; stroke: #334155; stroke-width: 1; rx: 6px; }
    .rowcard { fill: #0f172a; fill-opacity: 0.5; stroke: #334155; stroke-width: 0.8; rx: 6px; }
    .key { fill: #0f172a; stroke: #475569; stroke-width: 1.2; rx: 5px; }
    .key-star { fill: #27171c; stroke: #f43f5e; stroke-width: 1.2; rx: 5px; }
    .key-amber { fill: #271e10; stroke: #f59e0b; stroke-width: 1.2; rx: 5px; }

    text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', monospace, sans-serif;
    }
    .main-title { font-size: 23px; font-weight: 800; fill: #f8fafc; letter-spacing: 2px; }
    .sec-title { font-size: 16px; font-weight: 700; }
    .sec-sub { font-size: 12.5px; font-weight: 500; fill: #94a3b8; }
    .k-txt { font-size: 13px; font-weight: 700; fill: #38bdf8; }
    .k-txt-star { font-size: 13px; font-weight: 700; fill: #fb7185; }
    .k-txt-green { font-size: 13px; font-weight: 700; fill: #34d399; }
    .k-txt-purple { font-size: 13px; font-weight: 700; fill: #c084fc; }
    .k-txt-amber { font-size: 13px; font-weight: 700; fill: #fbbf24; }
    .k-txt-pink { font-size: 13px; font-weight: 700; fill: #f472b6; }
    .desc { font-size: 13.5px; fill: #e2e8f0; }
    .note { font-size: 12px; fill: #94a3b8; }
    .warn { font-size: 12.5px; font-weight: 600; fill: #fbbf24; }
    .code { font-size: 12.5px; font-weight: 600; fill: #a7f3d0; }
    .tree { font-size: 12.5px; fill: #cbd5e1; }
  </style>

  <!-- 1920x1080 全局背景 -->
  <rect width="1920" height="1080" class="bg" />

  <!-- ==================== 顶部标题栏 ==================== -->
  <g transform="translate(24, 20)">
    <rect width="1872" height="58" rx="10" fill="url(#titleGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="26" cy="29" r="6.5" fill="#ef4444" />
    <circle cx="46" cy="29" r="6.5" fill="#f59e0b" />
    <circle cx="66" cy="29" r="6.5" fill="#10b981" />
    <text x="936" y="37" text-anchor="middle" class="main-title">LINUX 终端 (Bash / Readline) 完整一页速查图</text>
    <text x="1848" y="35" text-anchor="end" class="sec-sub">16:9 横屏版 · Emacs / Default Mode</text>
  </g>

  <!-- ==================== 第一行：1 / 2 / 3 ==================== -->

  <!-- 【1. 光标跳转】 -->
  <g transform="translate(24, 94)">
    <rect width="612" height="315" class="card" />
    <path d="M 0 10 Q 0 0 10 0 L 602 0 Q 612 0 612 10 L 612 38 L 0 38 Z" fill="#0284c7" fill-opacity="0.22" />
    <line x1="0" y1="38" x2="612" y2="38" stroke="#0284c7" stroke-width="1.5" />
    <text x="16" y="25" class="sec-title" fill="#38bdf8">【1. 光标跳转】</text>

    <rect x="16" y="50" width="172" height="24" class="key" />
    <text x="26" y="67" class="k-txt">Ctrl + A / E</text>
    <text x="202" y="67" class="desc">跳到 行首 (Ahead) / 行尾 (End)</text>

    <rect x="16" y="83" width="172" height="24" class="key" />
    <text x="26" y="100" class="k-txt">Ctrl + B / F</text>
    <text x="202" y="100" class="desc">左移 / 右移 1 个字符 <tspan class="note">(Backward / Forward)</tspan></text>

    <rect x="16" y="116" width="172" height="24" class="key" />
    <text x="26" y="133" class="k-txt">Ctrl + ← / →</text>
    <text x="202" y="133" class="desc">按单词 左跳 / 右跳</text>

    <rect x="16" y="149" width="172" height="24" class="key" />
    <text x="26" y="166" class="k-txt">Alt  + B / F</text>
    <text x="202" y="166" class="desc">按单词 左跳 / 右跳 <tspan class="note">(标点即停)</tspan></text>

    <rect x="16" y="182" width="172" height="24" class="key" />
    <text x="26" y="199" class="k-txt">Ctrl + ] 再按字符</text>
    <text x="202" y="199" class="desc">向右闪现到该字符</text>

    <rect x="16" y="215" width="172" height="24" class="key" />
    <text x="26" y="232" class="k-txt">Alt+Ctrl+] 字符</text>
    <text x="202" y="232" class="desc">向左闪现到该字符</text>

    <rect x="16" y="248" width="172" height="24" class="key" />
    <text x="26" y="265" class="k-txt">Ctrl + X 连按两下</text>
    <text x="202" y="265" class="desc">当前位置与行首/标记点往返跳</text>
    <text x="202" y="288" class="note">(若外层终端软件未拦截 Ctrl+X)</text>
  </g>

  <!-- 【2. 剪切与删除】 -->
  <g transform="translate(654, 94)">
    <rect width="612" height="315" class="card" />
    <path d="M 0 10 Q 0 0 10 0 L 602 0 Q 612 0 612 10 L 612 38 L 0 38 Z" fill="#e11d48" fill-opacity="0.22" />
    <line x1="0" y1="38" x2="612" y2="38" stroke="#e11d48" stroke-width="1.5" />
    <text x="16" y="25" class="sec-title" fill="#fb7185">【2. 剪切与删除】</text>
    <text x="180" y="25" class="sec-sub">(带 <tspan fill="#fb7185" font-weight="bold">★</tspan> 号均进环形剪贴板)</text>

    <rect x="16" y="48" width="148" height="24" class="key-star" />
    <text x="26" y="65" class="k-txt-star">★ Ctrl + U</text>
    <text x="178" y="65" class="desc">切到行首 <tspan class="note">(Unix-discard)</tspan></text>

    <rect x="16" y="80" width="148" height="24" class="key-star" />
    <text x="26" y="97" class="k-txt-star">★ Ctrl + K</text>
    <text x="178" y="97" class="desc">切到行尾 <tspan class="note">(Kill-line)</tspan></text>

    <rect x="16" y="112" width="148" height="24" class="key-star" />
    <text x="26" y="129" class="k-txt-star">★ Ctrl + W</text>
    <text x="178" y="129" class="desc">往前切词 <tspan class="note">(按空格分界，粗粒度)</tspan></text>

    <rect x="16" y="144" width="148" height="24" class="key-star" />
    <text x="26" y="161" class="k-txt-star">★ Alt + BS</text>
    <text x="178" y="161" class="desc">往前切词 <tspan class="note">(按标点/斜杠分界，细粒度)</tspan></text>

    <rect x="16" y="176" width="148" height="24" class="key-star" />
    <text x="26" y="193" class="k-txt-star">★ Alt + D</text>
    <text x="178" y="193" class="desc">往后切词 <tspan class="note">(按标点分界)</tspan></text>

    <rect x="16" y="208" width="148" height="24" class="key" />
    <text x="26" y="225" class="k-txt">Alt + \</text>
    <text x="178" y="225" class="desc">删光光标两侧所有连续空格</text>

    <rect x="16" y="240" width="148" height="24" class="key" />
    <text x="26" y="257" class="k-txt">Ctrl + H</text>
    <text x="178" y="257" class="desc">删前 1 字符 <tspan class="note">(同 Backspace)</tspan></text>

    <rect x="16" y="272" width="148" height="24" class="key" />
    <text x="26" y="289" class="k-txt">Ctrl + D</text>
    <text x="178" y="289" class="desc">删当前字符 <tspan class="note">(空行则直接登出)</tspan></text>
  </g>

  <!-- 【3. 粘贴与轮换】 -->
  <g transform="translate(1284, 94)">
    <rect width="612" height="315" class="card" />
    <path d="M 0 10 Q 0 0 10 0 L 602 0 Q 612 0 612 10 L 612 38 L 0 38 Z" fill="#059669" fill-opacity="0.22" />
    <line x1="0" y1="38" x2="612" y2="38" stroke="#059669" stroke-width="1.5" />
    <text x="16" y="25" class="sec-title" fill="#34d399">【3. 粘贴与轮换】</text>
    <text x="166" y="25" class="sec-sub">(Kill-ring 环形队列)</text>

    <rect x="16" y="50" width="122" height="24" class="key" />
    <text x="26" y="67" class="k-txt-green">Ctrl + Y</text>
    <text x="152" y="67" class="desc">粘贴最后一次切下的内容 (Yank)</text>

    <rect x="16" y="82" width="122" height="24" class="key" />
    <text x="26" y="99" class="k-txt-green">Alt  + Y</text>
    <text x="152" y="99" class="desc">轮换更早剪切的词 (Yank-pop)</text>
    <text x="152" y="120" class="warn">(★ 必须紧跟在 Ctrl+Y 之后按！)</text>

    <rect x="16" y="134" width="580" height="72" class="subcard" />
    <text x="28" y="157" class="warn">★ 打了一半字想用 Ctrl+R 搜索：</text>
    <text x="36" y="185" class="code">Ctrl+U (切下暂存) ──► Ctrl+R (搜索) ──► Ctrl+Y (粘贴)</text>

    <rect x="16" y="216" width="580" height="84" class="subcard" />
    <text x="28" y="238" class="warn">★ 前缀直接翻历史 (写入 ~/.inputrc)：</text>
    <text x="36" y="262" class="code">"\e[A": history-search-backward</text>
    <text x="335" y="262" class="note"># ↑ 仅匹配当前前缀</text>
    <text x="36" y="285" class="code">"\e[B": history-search-forward</text>
    <text x="335" y="285" class="note"># ↓ 仅匹配当前前缀</text>
  </g>

  <!-- ==================== 第二行：4 / 5 ==================== -->

  <!-- 【4. 历史检索与存档】 -->
  <g transform="translate(24, 425)">
    <rect width="612" height="315" class="card" />
    <path d="M 0 10 Q 0 0 10 0 L 602 0 Q 612 0 612 10 L 612 38 L 0 38 Z" fill="#7c3aed" fill-opacity="0.22" />
    <line x1="0" y1="38" x2="612" y2="38" stroke="#7c3aed" stroke-width="1.5" />
    <text x="16" y="25" class="sec-title" fill="#c084fc">【4. 历史检索与存档】</text>

    <rect x="16" y="50" width="132" height="24" class="key" />
    <text x="26" y="67" class="k-txt-purple">Ctrl + P / N</text>
    <text x="162" y="67" class="desc">上一条 / 下一条历史 <tspan class="note">(同 ↑ / ↓)</tspan></text>

    <rect x="16" y="84" width="132" height="24" class="key" />
    <text x="26" y="101" class="k-txt-purple">Alt  + .</text>
    <text x="162" y="101" class="desc">粘贴上条命令的最后一个参数</text>
    <text x="162" y="121" class="note">(连按可依次往上翻更早命令的末尾参数)</text>

    <rect x="16" y="135" width="132" height="24" class="key" />
    <text x="26" y="152" class="k-txt-purple">Alt  + #</text>
    <text x="162" y="152" class="desc">行首加 # 注释并存入历史 <tspan class="note">(命令存档)</tspan></text>

    <rect x="16" y="170" width="132" height="24" class="key" />
    <text x="26" y="187" class="k-txt-purple">Ctrl + R</text>
    <text x="162" y="187" class="desc">逆向搜索历史命令 <tspan class="note">(reverse-i-search)</tspan></text>

    <rect x="162" y="200" width="434" height="100" class="subcard" />
    <text x="176" y="222" class="tree">├─ <tspan class="k-txt-purple">连按 Ctrl+R</tspan> : 继续往上翻更早匹配项</text>
    <text x="176" y="244" class="tree">├─ <tspan class="k-txt-purple">按 Enter</tspan>    : 立即执行找到的命令</text>
    <text x="176" y="266" class="tree">├─ <tspan class="k-txt-purple">按 → 或 ^J</tspan>  : 留在当前行继续编辑修改</text>
    <text x="176" y="288" class="tree">└─ <tspan class="k-txt-purple">按 Ctrl+G</tspan>   : 取消搜索，恢复原输入行</text>
  </g>

  <!-- 【5. 撤销、恢复与防丢时间线】 (跨两列) -->
  <g transform="translate(654, 425)">
    <rect width="1242" height="315" class="card" />
    <path d="M 0 10 Q 0 0 10 0 L 1232 0 Q 1242 0 1242 10 L 1242 38 L 0 38 Z" fill="#d97706" fill-opacity="0.22" />
    <line x1="0" y1="38" x2="1242" y2="38" stroke="#d97706" stroke-width="1.5" />
    <text x="18" y="25" class="sec-title" fill="#fbbf24">【5. 撤销 (Undo)、恢复 (Redo) 与防丢时间线】</text>
    <text x="415" y="25" class="sec-sub">(线性全记录账本 —— 任何误操作均可逆向找回)</text>

    <!-- 条目 1 -->
    <rect x="16" y="49" width="1210" height="44" class="rowcard" />
    <text x="30" y="76" class="desc" font-weight="bold" fill="#fde68a">● 单步撤销 (Undo)</text>
    <rect x="300" y="59" width="155" height="24" class="key-amber" />
    <text x="314" y="76" class="k-txt-amber">Ctrl + / (或 ^_)</text>
    <text x="472" y="76" class="desc">避开 Ubuntu 终端 <tspan class="code">Ctrl + -</tspan> 缩放冲突；也可按 <tspan class="code">Ctrl+X, ^U</tspan></text>

    <!-- 条目 2 -->
    <rect x="16" y="101" width="1210" height="44" class="rowcard" />
    <text x="30" y="128" class="desc" font-weight="bold" fill="#fde68a">● 刚撤销完想恢复 (Redo)</text>
    <rect x="300" y="111" width="155" height="24" class="key-amber" />
    <text x="312" y="128" class="k-txt-amber">← / → 再 Ctrl+/</text>
    <text x="472" y="128" class="desc">先按一下方向键 <tspan class="k-txt-amber">←</tspan> 或 <tspan class="k-txt-amber">→</tspan> 打断连续撤销状态，再按 <tspan class="k-txt-amber">Ctrl + /</tspan> 即可反向恢复</text>

    <!-- 条目 3 -->
    <rect x="16" y="153" width="1210" height="44" class="rowcard" />
    <text x="30" y="180" class="desc" font-weight="bold" fill="#fde68a">● 撤销后又敲了废字想救回原状</text>
    <rect x="300" y="163" width="155" height="24" class="key-amber" />
    <text x="314" y="180" class="k-txt-amber">一路狂按 Ctrl+/</text>
    <text x="472" y="180" class="desc">什么都别管，连按 <tspan class="k-txt-amber">Ctrl + /</tspan> <tspan class="note">(先撤掉新敲的废字，随后自动把之前的撤销反撤回来)</tspan></text>

    <!-- 条目 4 -->
    <rect x="16" y="205" width="1210" height="44" class="rowcard" />
    <text x="30" y="232" class="desc" font-weight="bold" fill="#fde68a">● 整行彻底重置回初始态</text>
    <rect x="300" y="215" width="155" height="24" class="key-amber" />
    <text x="342" y="232" class="k-txt-amber">Alt + R</text>
    <text x="472" y="232" class="desc">Revert 整行彻底还原回初始状态 <tspan class="warn">(注意：会清空中间撤销链！)</tspan></text>

    <!-- 条目 5 -->
    <rect x="16" y="257" width="1210" height="44" class="rowcard" />
    <text x="30" y="284" class="desc" font-weight="bold" fill="#fde68a">● 误触 Alt+R 清空了怎么救</text>
    <rect x="300" y="267" width="155" height="24" class="key-amber" />
    <text x="314" y="284" class="k-txt-amber">立刻按 Ctrl + /</text>
    <text x="472" y="284" class="desc">别动任何其他键，立刻按一次 <tspan class="k-txt-amber">Ctrl + /</tspan> 即可一把救回清空前的完整内容</text>
  </g>

  <!-- ==================== 第三行：6 / 7 / 黄金铁律 ==================== -->

  <!-- 【6. 文本变形与外部编辑器】 -->
  <g transform="translate(24, 756)">
    <rect width="612" height="300" class="card" />
    <path d="M 0 10 Q 0 0 10 0 L 602 0 Q 612 0 612 10 L 612 38 L 0 38 Z" fill="#db2777" fill-opacity="0.22" />
    <line x1="0" y1="38" x2="612" y2="38" stroke="#db2777" stroke-width="1.5" />
    <text x="16" y="25" class="sec-title" fill="#f472b6">【6. 文本变形与外部编辑器】</text>

    <rect x="16" y="54" width="142" height="26" class="key" />
    <text x="28" y="72" class="k-txt-pink">Ctrl + T</text>
    <text x="174" y="72" class="desc">交换光标前 2 个字符 <tspan class="note">(治打字手滑)</tspan></text>

    <rect x="16" y="94" width="142" height="26" class="key" />
    <text x="28" y="112" class="k-txt-pink">Alt  + T</text>
    <text x="174" y="112" class="desc">交换光标处 2 个单词</text>

    <rect x="16" y="134" width="142" height="26" class="key" />
    <text x="28" y="152" class="k-txt-pink">Alt  + U</text>
    <text x="174" y="152" class="desc">光标后单词转 <tspan font-weight="bold" fill="#f472b6">全大写</tspan> (Upper)</text>

    <rect x="16" y="174" width="142" height="26" class="key" />
    <text x="28" y="192" class="k-txt-pink">Alt  + L</text>
    <text x="174" y="192" class="desc">光标后单词转 <tspan font-weight="bold" fill="#f472b6">全小写</tspan> (Lower)</text>

    <rect x="16" y="214" width="142" height="26" class="key" />
    <text x="28" y="232" class="k-txt-pink">Alt  + C</text>
    <text x="174" y="232" class="desc">光标后单词 <tspan font-weight="bold" fill="#f472b6">首字母大写</tspan> (Capitalize)</text>

    <rect x="16" y="254" width="142" height="26" class="key" />
    <text x="28" y="272" class="k-txt-pink">Ctrl+X, ^E</text>
    <text x="174" y="272" class="desc">调出 Vim / Nano 编辑当前长命令</text>
  </g>

  <!-- 【7. 进程与屏幕控制】 -->
  <g transform="translate(654, 756)">
    <rect width="612" height="300" class="card" />
    <path d="M 0 10 Q 0 0 10 0 L 602 0 Q 612 0 612 10 L 612 38 L 0 38 Z" fill="#0d9488" fill-opacity="0.22" />
    <line x1="0" y1="38" x2="612" y2="38" stroke="#0d9488" stroke-width="1.5" />
    <text x="16" y="25" class="sec-title" fill="#2dd4bf">【7. 进程与屏幕控制】</text>

    <rect x="16" y="54" width="175" height="26" class="key" />
    <text x="28" y="72" class="k-txt-green">Ctrl + C</text>
    <text x="206" y="72" class="desc">强行终止前台程序 / 废除当前输入</text>

    <rect x="16" y="94" width="175" height="26" class="key" />
    <text x="28" y="112" class="k-txt-green">Ctrl + Z</text>
    <text x="206" y="112" class="desc">挂起程序到后台 <tspan class="note">(敲 fg 恢复回前台)</tspan></text>

    <rect x="16" y="134" width="175" height="26" class="key" />
    <text x="28" y="152" class="k-txt-green">Ctrl + L</text>
    <text x="206" y="152" class="desc">清屏 <tspan class="note">(同 clear，但保留已打的字)</tspan></text>

    <rect x="16" y="174" width="175" height="26" class="key" />
    <text x="28" y="192" class="k-txt-green">Ctrl + S</text>
    <text x="206" y="192" class="desc">冻结屏幕输出 <tspan class="warn">(常因误触导致假死)</tspan></text>

    <rect x="16" y="214" width="175" height="26" class="key" />
    <text x="28" y="232" class="k-txt-green">Ctrl + Q</text>
    <text x="206" y="232" class="desc">解除 Ctrl+S 的屏幕假死冻结</text>

    <rect x="16" y="254" width="175" height="26" class="key" />
    <text x="24" y="272" class="k-txt-green">set -o vi / emacs</text>
    <text x="206" y="272" class="desc">切换 Vi 模式 / 默认 Emacs 模式</text>
  </g>

  <!-- 【💡 终端黄金铁律】 -->
  <g transform="translate(1284, 756)">
    <rect width="612" height="300" class="card-rule" />
    <path d="M 0 10 Q 0 0 10 0 L 602 0 Q 612 0 612 10 L 612 38 L 0 38 Z" fill="#f59e0b" fill-opacity="0.25" />
    <line x1="0" y1="38" x2="612" y2="38" stroke="#f59e0b" stroke-width="1.5" />
    <text x="16" y="25" class="sec-title" fill="#fbbf24">【💡 终端黄金铁律与避坑指南】</text>

    <!-- 铁律 1 -->
    <rect x="16" y="52" width="580" height="110" class="subcard" />
    <text x="28" y="78" class="warn" font-size="14">💡 铁律 1：Alt 键失灵或唤起顶栏菜单怎么办？</text>
    <text x="28" y="106" class="desc">一律改为：<tspan fill="#fde68a" font-weight="bold">【先按一下 Esc 松开，再按对应字母/符号键】</tspan></text>
    <text x="28" y="138" class="code">示例：Alt + B  ═══  先按一下 Esc 松开 ──► 再按 B</text>

    <!-- 铁律 2 -->
    <rect x="16" y="174" width="580" height="110" class="subcard" />
    <text x="28" y="200" class="warn" font-size="14">💡 铁律 2：鼠标拖选高亮 ≠ Readline 内部选区</text>
    <text x="28" y="228" class="desc">鼠标拖选高亮仅属外层窗口复制，按退格键<tspan fill="#fb7185" font-weight="bold">绝不能删选区</tspan>；</text>
    <text x="28" y="258" class="desc">删中间段请用 <tspan fill="#38bdf8" font-weight="bold">【1. 光标跳转】</tspan> + <tspan fill="#fb7185" font-weight="bold">【2. 剪切与删除】</tspan> 组合操作。</text>
  </g>
