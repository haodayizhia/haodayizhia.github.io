name: Market Atlas isolated full acceptance
on:
  push:
    branches:
      - qa/market-atlas-full-acceptance
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-preflight
  cancel-in-progress: false
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Theme, engine and publication tests
        run: node --test scripts/theme.test.cjs scripts/market_atlas/engine.test.cjs scripts/market_atlas/publish.test.cjs
      - name: Data packaging
        run: python3 scripts/market_atlas/package_test.py
      - name: Build
        run: python3 scripts/build.py
      - name: UI unit tests
        run: node --test scripts/market_atlas/ui.test.cjs
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [scripts/layout.test.cjs, scripts/market_atlas/browser.test.cjs, scripts/market_atlas/journey.test.cjs]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build
        run: python3 scripts/build.py
      - name: Browser setup
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/atlas-browser/node_modules/playwright/cli.js" install chromium
      - name: Run acceptance suite
        env:
          NODE_PATH: ${{ runner.temp }}/atlas-browser/node_modules
          ATLAS_QA_OUTPUT: ${{ runner.temp }}/atlas-qa
          QA_SUITE: ${{ matrix.suite }}
        run: node "$QA_SUITE"
