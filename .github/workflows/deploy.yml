name: Build and Deploy BRO Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js for static rendering
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify theme persistence and MarketAtlas calculations
        run: node --test scripts/theme.test.cjs scripts/market_atlas/engine.test.cjs scripts/market_atlas/publish.test.cjs

      - name: Verify MarketAtlas data packaging and failure retention
        run: python3 scripts/market_atlas/package_test.py

      - name: Compile content and prerender pages
        run: python3 scripts/build.py

      - name: Verify mobile chart geometry and first-paint theme boot
        run: node --test scripts/market_atlas/ui.test.cjs

      - name: Install isolated browser acceptance tools
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/atlas-browser/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Verify chart gestures, comparisons and responsive layouts
        env:
          NODE_PATH: ${{ runner.temp }}/atlas-browser/node_modules
          ATLAS_QA_OUTPUT: ${{ runner.temp }}/atlas-qa
        run: node scripts/market_atlas/browser.test.cjs

      - name: Prepare static site artifact
        run: |
          mkdir -p _site
          cp ./*.html _site/
          cp .nojekyll _site/
          cp -r assets _site/
          cp -r resources _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
