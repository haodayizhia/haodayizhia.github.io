name: Build and Deploy BRO Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js for static rendering
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify theme persistence and history restoration
        run: node --test scripts/theme.test.cjs

      - name: Compile content and prerender pages
        run: python3 scripts/build.py

      - name: Prepare static site artifact
        run: |
          mkdir -p _site
          cp ./*.html _site/
          cp .nojekyll _site/
          cp -r assets _site/
          cp -r resources _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
